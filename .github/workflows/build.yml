name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed only to attach files to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # unit tests (vault, Android storage, anti-spam/poisoning, payment links, HTTP retry) + translation check
      - name: Tests
        run: npm test

      # Chrome + Firefox zips
      - name: Build extensions
        run: npm run build:ext

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # ANDROID_HOME is preinstalled on ubuntu runners; JAVA_HOME comes from setup-java
      # the APK (GitHub Release, direct install) and the AAB (Google Play), signed with the same key
      - name: Build Android release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          export ANDROID_VERSION_NAME="$(node -p "require('./package.json').version")"
          npm run android -- --release
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs dist/chakra-android-release.apk
          # an AAB is signed like a jar: jarsigner prints "jar verified" only when it is signed
          out="$(jarsigner -verify dist/chakra-android-release.aab)"; echo "$out"
          echo "$out" | grep -q "^jar verified" || { echo "::error::The AAB is not signed"; exit 1; }
          keytool -printcert -jarfile dist/chakra-android-release.aab

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: chakra-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            dist/chakra-chrome.zip
            dist/chakra-firefox.zip
            dist/chakra-android-release.apk
            dist/chakra-android-release.aab
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/chakra-chrome.zip
            dist/chakra-firefox.zip
            dist/chakra-android-release.apk
