# The landing page (landing/: React + Vite) on GitHub Pages, at https://chakrawallet.dev.
# Built and published at every push to master that touches it, or by hand (Actions > Landing > Run workflow).
# One-time setup on GitHub: Settings > Pages > Source: "GitHub Actions"; Custom domain: chakrawallet.dev, then
# "Enforce HTTPS" (.dev domains only work over HTTPS). DNS records at the registrar: see landing/README.md.
name: Landing

on:
  push:
    branches: [master]
    paths: ['landing/**', 'src/shared/locales/en/legal.js', '.github/workflows/landing.yml'] # legal.js: the terms on /terms
  workflow_dispatch:

permissions:
  contents: read
  pages: write # publish to GitHub Pages
  id-token: write # prove the deployment comes from this workflow

concurrency: # one deployment at a time; a newer push waits for the running one
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
