<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open in Chakra</title>
    <meta name="description" content="A TON site asked to connect to your Chakra wallet." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1b4ddb" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      https://chakrawallet.dev/ton-connect: TON Connect's universal link for Chakra. With the app installed, Android
      opens these links straight in Chakra (verified through /.well-known/assetlinks.json) and this page is never seen.
      It shows when Chakra isn't installed, or when the link was opened in another app's browser (e.g. Telegram's):
      "Open in Chakra" hands the same request to the app (chakra-tc://), "Get Chakra" leads to the download.
    -->
  </head>
  <body>
    <main class="tc">
      <a class="tc-brand" href="/"><img src="/icon.png" alt="" width="28" height="28" />Chakra</a>

      <!-- the site and the wallet, tied by a guilloche ribbon (drawn by src/tonconnect.js) -->
      <div class="tc-tie" aria-hidden="true">
        <span class="tc-seal tc-seal-site">
          <img id="tc-site-icon" alt="" referrerpolicy="no-referrer" hidden />
          <svg id="tc-site-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.1 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.1-3.6-8.5s1.2-6.2 3.6-8.5z" /></svg>
        </span>
        <svg class="tc-ribbon" id="tc-ribbon" viewBox="0 0 320 96" preserveAspectRatio="none"></svg>
        <span class="tc-seal tc-seal-chakra"><img src="/apple-touch-icon.png" alt="" /></span>
      </div>

      <h1 id="tc-title">A TON site wants to connect to your Chakra wallet</h1>
      <p class="tc-host" id="tc-host"></p>

      <a class="tc-open" id="tc-open" href="chakra-tc://">Open in Chakra</a>
      <p class="tc-get">Don't have Chakra yet? <a href="/#download">Get Chakra</a></p>

      <p class="tc-note">On a computer? Open Chakra on your phone and scan the code with the QR button on your wallet card.</p>
    </main>
    <script type="module" src="/src/tonconnect.js"></script>
  </body>
</html>
