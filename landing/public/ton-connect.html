<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open in Chakra</title>
  <meta name="description" content="A TON app or site asked to connect to your Chakra wallet." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1b4ddb" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <!--
    https://chakrawallet.dev/ton-connect: TON Connect's universal link for Chakra. With the app installed Android opens
    it straight in Chakra (verified through /.well-known/assetlinks.json) and this page is never seen. It shows when the
    app isn't installed, or when the link was opened inside another app's browser: then "Open in Chakra" passes the
    same request to the app (chakra-tc://), and the other button leads to the download.
  -->
  <style>
    :root {
      --bg: #f4f6fa; --card: #ffffff; --text: #0e1422; --muted: #5b6577; --border: #e3e7ee;
      --primary: #1b4ddb; --primary-press: #143baa; --on-primary: #ffffff;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b0f17; --card: #131a26; --text: #e8ecf4; --muted: #8d97aa; --border: #232d3e; --primary: #6e95ff; --primary-press: #5a83f5; --on-primary: #0b1a4a; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    }
    main {
      width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 22px;
      padding: 32px 24px; text-align: center;
    }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 1.375rem; line-height: 1.25; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    .btn {
      display: block; width: 100%; padding: 14px 16px; border-radius: 999px; font-weight: 600; text-decoration: none;
      border: 1px solid transparent;
    }
    .primary { background: var(--primary); color: var(--on-primary); }
    .primary:active { background: var(--primary-press); }
    .secondary { margin-top: 10px; color: var(--text); border-color: var(--border); }
    .note { font-size: .875rem; margin: 24px 0 0; }
  </style>
</head>
<body>
  <main>
    <img src="/icon.png" alt="" />
    <h1>Open in Chakra</h1>
    <p>A TON app or site asked to connect to your wallet. If Chakra is installed on this phone, open the request there.</p>
    <a class="btn primary" id="open" href="chakra-tc://">Open in Chakra</a>
    <a class="btn secondary" href="/#download">Get Chakra</a>
    <p class="note">On a computer? Open Chakra on your phone and tap the QR button on the wallet card to scan the code.</p>
  </main>
  <script>
    // the same request (the query string: v, id, r, ret) for the app
    document.getElementById('open').href = 'chakra-tc://' + location.search;
  </script>
</body>
</html>
